name: Report a problem
description: Something doesn't work as it should. (Tip: Help ▸ Report a Problem… in the app fills in the versions for you.)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? Steps to make it happen again help most.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lukla Data Studio version
      description: Lukla Data Studio ▸ About Lukla Data Studio
      placeholder: "1.3 (10)"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: SQL Server version
      placeholder: "SQL Server 2022 / Azure SQL Database"
  - type: markdown
    attributes:
      value: "This issue is public. Leave out passwords, server names and data."
